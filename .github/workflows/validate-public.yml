name: Validate public face
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public face must stay crawlable
        run: |
          set -euo pipefail
          grep -q "Touch. Talk. Go." index.html
          grep -q "canvas#field" index.html
          grep -q "As an Amazon Associate" index.html
          grep -q "Fully autonomous public surface" autonomy.html
          grep -q "Zero human input required" autonomy.html
          if grep -q "Deny by default" products/index.html; then
            echo "products/index.html is a deny wall" >&2
            exit 1
          fi
          if grep -q "^Disallow: /$" robots.txt && ! grep -q "^Allow: /$" robots.txt; then
            echo "robots.txt disallows all" >&2
            exit 1
          fi
          echo "public face validate ok"
