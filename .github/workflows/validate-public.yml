name: Validate public face
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawlable catalog
        run: |
          set -euo pipefail
          grep -q "Touch. Talk. Go." index.html
          grep -q "canvas#field" index.html
          grep -q "As an Amazon Associate" index.html
          if grep -q "Deny by default" products/index.html; then echo "products hub deny wall" >&2; exit 1; fi
          if grep -q "^Disallow: /$" robots.txt && ! grep -q "^Allow: /$" robots.txt; then echo "robots disallow all" >&2; exit 1; fi
          echo "catalog ok"
      - name: Forbid leaked objects
        run: |
          set -euo pipefail
          if grep -R -n --exclude-dir=.git -E "buy\.stripe\.com/test_|sk_live_|sk_test_|ghp_[A-Za-z0-9]|HMAC=|BILL-CIPHER" .; then
            echo "forbidden object on public face" >&2
            exit 1
          fi
          echo "forbid ok"
