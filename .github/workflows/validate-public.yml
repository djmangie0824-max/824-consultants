name: Validate public face
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Crawlable catalog
        run: |
          set -euo pipefail
          grep -q "Touch. Talk. Go." index.html
          grep -q "canvas#field" index.html
          grep -q "As an Amazon Associate" index.html
          if grep -q "Deny by default" products/index.html; then echo "products hub deny wall" >&2; exit 1; fi
          if grep -q "^Disallow: /$" robots.txt && ! grep -q "^Allow: /$" robots.txt; then echo "robots disallow all" >&2; exit 1; fi
          echo "catalog ok"
      - name: Forbid leaked objects
        run: |
          set -euo pipefail
          hit=0
          while IFS= read -r line; do
            echo "$line"
            hit=1
          done < <(grep -R --exclude-dir=.git --exclude-dir=.github -n -F "buy.stripe.com/test_" . || true)
          while IFS= read -r line; do
            echo "$line"
            hit=1
          done < <(grep -R --exclude-dir=.git --exclude-dir=.github -n -E "sk_live_[A-Za-z0-9]+" . || true)
          while IFS= read -r line; do
            echo "$line"
            hit=1
          done < <(grep -R --exclude-dir=.git --exclude-dir=.github -n -F "BILL-CIPHER" . || true)
          if [ "$hit" -ne 0 ]; then echo "forbidden object on public face" >&2; exit 1; fi
          echo "forbid ok"
