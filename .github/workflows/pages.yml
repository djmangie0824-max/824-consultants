# Automated GitHub Pages + deployment notifications
# Owner: Douglas James Mangie II / 824 Consultants LLC
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this deploy"
        required: false
        default: "manual"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site_url: https://djmangie0824-max.github.io/824-consultants/
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Validate public surface
        run: |
          set -euo pipefail
          test -f index.html
          test -f autonomy.html
          test -f sim.html
          test -f sitemap.xml
          test -f robots.txt
          grep -q "Fully autonomous public surface" autonomy.html
          grep -q "Zero human input required" autonomy.html
          grep -q "Touch. Talk. Go." index.html
          echo "validate ok"

      - name: Assemble clean site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/' \
            --exclude '.DS_Store' \
            --exclude '*.mp4' \
            ./ _site/
          python3 - <<'PY'
          import json, os, pathlib
          data = {
            "deployedAt": __import__("datetime").datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
            "sha": os.environ["GITHUB_SHA"],
            "shortSha": os.environ["GITHUB_SHA"][:7],
            "ref": os.environ["GITHUB_REF"],
            "runId": os.environ["GITHUB_RUN_ID"],
            "runUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            "event": os.environ["GITHUB_EVENT_NAME"],
            "reason": """${{ github.event.inputs.reason || 'push' }}""",
            "url": "https://djmangie0824-max.github.io/824-consultants/",
            "owner": "Douglas James Mangie II / 824 Consultants LLC",
            "notifications": True,
          }
          pathlib.Path("_site/DEPLOY_STAMP.json").write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data, indent=2))
          PY
          find _site -type f | wc -l

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-success:
    name: Notify deploy success
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<MD
          # Pages deploy ✅

          | Field | Value |
          |-------|-------|
          | **Site** | ${{ needs.deploy.outputs.page_url || needs.build.outputs.site_url }} |
          | **SHA** | \`${{ needs.build.outputs.short_sha }}\` |
          | **Run** | [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | **Event** | ${{ github.event_name }} |
          | **Actor** | @${{ github.actor }} |
          | **Stamp** | [DEPLOY_STAMP.json](https://djmangie0824-max.github.io/824-consultants/DEPLOY_STAMP.json) |

          Protected FULL AUTO strings validated. Immersive hub validated.
          MD

      - name: Commit comment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const short = sha.slice(0, 7);
            const url = 'https://djmangie0824-max.github.io/824-consultants/';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## GitHub Pages deploy ✅',
              '',
              `- **Site:** ${url}`,
              `- **SHA:** \`${short}\``,
              `- **Run:** ${run}`,
              `- **Stamp:** ${url}DEPLOY_STAMP.json`,
              `- **Event:** ${context.eventName}`,
              '',
              '_Automated notification · 824 Consultants LLC_',
            ].join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body,
            });

      - name: Deploy log issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Deploy notifications · 824 Consultants Pages';
            const sha = context.sha.slice(0, 7);
            const url = 'https://djmangie0824-max.github.io/824-consultants/';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const stamp = new Date().toISOString();
            const line = `| ${stamp} | ✅ success | \`${sha}\` | [run](${run}) | [site](${url}) | @${context.actor} |`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-notifications',
              per_page: 5,
            });
            let issue = issues.data.find(i => i.title === title);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['deploy-notifications'],
                body: [
                  '# Deploy notification log',
                  '',
                  'Auto-updated on every successful (or failed) GitHub Pages deploy.',
                  '',
                  '| When (UTC) | Status | SHA | Run | Site | Actor |',
                  '|------------|--------|-----|-----|------|-------|',
                  line,
                  '',
                  '© 2026 824 Consultants LLC. ONLY YOU. FOREVER.',
                ].join('\n'),
              });
              issue = created.data;
            } else {
              // Prepend row after table header
              const body = issue.body || '';
              const marker = '|------------|--------|-----|-----|------|-------|';
              let next;
              if (body.includes(marker)) {
                next = body.replace(marker, marker + '\n' + line);
              } else {
                next = body + '\n' + line;
              }
              // Keep log from exploding — trim to ~80 rows
              const rows = next.split('\n');
              const tableRows = rows.filter(r => r.startsWith('| 20') || r.startsWith('| 19'));
              if (tableRows.length > 80) {
                const drop = new Set(tableRows.slice(80));
                next = rows.filter(r => !drop.has(r)).join('\n');
              }
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: next,
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ **Deployed** \`${sha}\` → ${url}\nRun: ${run}`,
            });

      - name: Optional webhook
        env:
          DEPLOY_NOTIFY_WEBHOOK: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_NOTIFY_WEBHOOK:-}" ]; then
            echo "No DEPLOY_NOTIFY_WEBHOOK secret — skip external webhook"
            exit 0
          fi
          BODY=$(cat <<JSON
          {
            "status": "success",
            "site": "https://djmangie0824-max.github.io/824-consultants/",
            "sha": "${{ github.sha }}",
            "shortSha": "${{ needs.build.outputs.short_sha }}",
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "actor": "${{ github.actor }}",
            "event": "${{ github.event_name }}",
            "stamp": "https://djmangie0824-max.github.io/824-consultants/DEPLOY_STAMP.json"
          }
          JSON
          )
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$BODY" "$DEPLOY_NOTIFY_WEBHOOK"
          echo "webhook ok"

  notify-failure:
    name: Notify deploy failure
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Job summary (failure)
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<MD
          # Pages deploy ❌

          Deploy failed. Check the failed job logs.

          | Field | Value |
          |-------|-------|
          | **SHA** | \`${{ github.sha }}\` |
          | **Run** | [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | **Actor** | @${{ github.actor }} |
          MD

      - name: Commit comment (failure)
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## GitHub Pages deploy ❌\n\nRun: ${run}\n\n_Automated failure notification · 824 Consultants LLC_`,
            });

      - name: Issue comment (failure)
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Deploy notifications · 824 Consultants Pages';
            const sha = context.sha.slice(0, 7);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const stamp = new Date().toISOString();
            const line = `| ${stamp} | ❌ failure | \`${sha}\` | [run](${run}) | — | @${context.actor} |`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-notifications',
              per_page: 5,
            });
            let issue = issues.data.find(i => i.title === title);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['deploy-notifications'],
                body: [
                  '# Deploy notification log',
                  '',
                  '| When (UTC) | Status | SHA | Run | Site | Actor |',
                  '|------------|--------|-----|-----|------|-------|',
                  line,
                ].join('\n'),
              });
              issue = created.data;
            } else {
              const marker = '|------------|--------|-----|-----|------|-------|';
              const body = issue.body || '';
              const next = body.includes(marker) ? body.replace(marker, marker + '\n' + line) : body + '\n' + line;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: next,
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `❌ **Deploy failed** \`${sha}\`\nRun: ${run}`,
            });

      - name: Optional failure webhook
        env:
          DEPLOY_NOTIFY_WEBHOOK: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_NOTIFY_WEBHOOK:-}" ]; then
            echo "No DEPLOY_NOTIFY_WEBHOOK secret — skip"
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"status":"failure","sha":"${{ github.sha }}","runUrl":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","actor":"${{ github.actor }}"}' \
            "$DEPLOY_NOTIFY_WEBHOOK" || true
